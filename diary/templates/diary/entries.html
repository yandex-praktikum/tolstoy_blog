{% extends "diary/base.html" %}{% block content %}<h1>Дневники Льва Толстого</h1><p>Фрагменты записей 1847 года. Учебный сайт для практики парсинга.</p>{% for entry in entries %}<article class="diary-entry"><time datetime="{{ entry.date|date:'Y-m-d' }}">{{ entry.date }}</time><h2><a href="{% url 'entry' entry.pk %}">{{ entry.title }}</a></h2><p class="text">{{ entry.text }}</p></article>{% endfor %}{% endblock %}
